<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Helm · 我的 AI 团队</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* Helm cockpit rebuild (chairman verdict). Palette: ONLY #000000 #FFFFFF #F5F5F5 #E5E5E5 #737373 #FF4713 #1D8348. Orange (#FF4713) appears ONLY on the signal-disc core/ring and the pending badge. #FF4713 is never a text color. #737373 on #F5F5F5 never carries essential text: essential text on soft backgrounds is #000000. One display weight (800) for titles/numbers; tabular numerals wherever counts appear. */
:root{--ink:#000000;--paper:#FFFFFF;--card:#FFFFFF;--line:#E5E5E5;--accent:#FF4713;--ok:#1D8348;--mut:#737373;--soft:#F5F5F5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);padding-bottom:76px;font-size:15px;line-height:1.5}
header{background:var(--ink);color:#FFFFFF;padding:10px 14px 9px;position:sticky;top:0;z-index:5}
header .hi{font-size:12px;line-height:1.4;opacity:.78}
header h1{font-size:18px;line-height:1.25;font-weight:800;letter-spacing:-.01em;margin-top:2px}
header .sub{font-size:12px;line-height:1.4;opacity:.85;margin-top:3px}
main{padding:10px 12px 6px;max-width:640px;margin:0 auto}
.view{display:none}
.view.on{display:block;animation:view-in .16s ease-out}
@keyframes view-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.num{font-variant-numeric:tabular-nums}
.search-card{position:sticky;top:78px;z-index:4;background:var(--paper);padding:2px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h2{font-size:15px;line-height:1.3;font-weight:800;margin-bottom:8px}
.block-head{display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:8px;background:none;border:none;padding:0;font-size:14px;line-height:1.3;font-weight:800;color:var(--ink);cursor:pointer;text-align:left}
.block-head .go{font-size:12px;line-height:1.3;font-weight:700;color:var(--ink);flex:none}
.tag{display:inline-block;font-size:11px;line-height:1.4;font-weight:700;background:var(--soft);color:var(--ink);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.item{border-top:1px solid var(--line);padding:9px 0}
.item:first-of-type{border-top:none}
.item .t{font-size:15px;line-height:1.35;font-weight:700}
.item .d{font-size:13px;line-height:1.5;color:var(--ink);margin-top:3px}
.item.done .t{text-decoration:line-through;color:var(--mut)}
.empty{font-size:13px;line-height:1.6;color:var(--ink);padding:8px 0}
.note{font-size:11.5px;line-height:1.5;color:var(--ink);text-align:center;margin:10px 0 2px}
label{display:block;font-size:13px;line-height:1.4;font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:14px;line-height:1.4;font-family:inherit;background:#FFFFFF;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:1px solid var(--line);background:#FFFFFF;border-radius:10px;padding:11px 8px;font-size:14px;line-height:1.4;min-height:44px;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#FFFFFF;font-weight:700}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#FFFFFF;font-weight:700}
.small{font-size:12.5px;line-height:1.4;padding:6px 10px;border:1px solid var(--ink);background:#FFFFFF;border-radius:99px;color:var(--ink);cursor:pointer;font-weight:700}
.small.accent{color:var(--ink);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.agent{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.agent .n{font-size:15px;line-height:1.3;font-weight:800}
.agent .r{font-size:12px;line-height:1.4;color:var(--ink);margin-top:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--ok);margin-right:4px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:92px;background:#FFFFFF}
.q b{font-size:12px;line-height:1.4;color:var(--ink);font-weight:800}
.q ul{list-style:none;font-size:13px;line-height:1.7;margin-top:6px}
.q li{margin-bottom:10px}
.q .meta{font-size:12px;line-height:1.5;color:var(--ink)}
.msg{background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.msg .who{font-size:12px;line-height:1.4;color:var(--ink);font-weight:700;margin-bottom:4px}
.msg .body{font-size:14px;line-height:1.5}
nav{position:fixed;left:0;right:0;bottom:0;background:#FFFFFF;border-top:1px solid var(--line);display:flex;z-index:5}
nav button{flex:1;background:none;border:none;padding:10px 0 12px;font-size:12.5px;line-height:1.3;color:var(--ink);cursor:pointer}
nav button.on{font-weight:800;box-shadow:inset 0 2px 0 var(--ink)}
.big{width:100%;background:var(--ink);color:#FFFFFF;border:none;border-radius:12px;padding:14px;font-size:15px;line-height:1.3;font-weight:700;cursor:pointer}
.searchbar{display:flex;gap:8px}
.searchbar input{flex:1}
.searchbar .small{flex:none}
.snapstrip{display:flex;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;line-height:1.3;margin-bottom:8px;white-space:nowrap;overflow:hidden}
.snapdisc{width:24px;height:24px;border-radius:50%;background:conic-gradient(var(--accent) 0 var(--disc,25%),var(--soft) 0 100%);position:relative;flex:none}
.snapdisc-core{position:absolute;inset:7px;background:var(--accent);border-radius:50%;display:block}
.snapline{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.snapline .snapstate{font-weight:800}
.snapgen{flex:none;background:var(--ink);color:#FFFFFF;border:none;border-radius:99px;padding:3px 8px;font-size:12px;line-height:1.3;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.pending-strip{display:flex;width:100%;gap:8px;align-items:center;text-align:left;background:#FFFFFF;border:1px solid var(--ink);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px;line-height:1.35;color:var(--ink);cursor:pointer}
.pending-strip .go{margin-left:auto;font-weight:700;flex:none}
.pending-slim{display:flex;gap:8px;align-items:center;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12.5px;line-height:1.35;color:var(--ink)}
.ov-badge{display:inline-block;background:var(--accent);color:#000000;font-size:12px;line-height:1.3;font-weight:800;border-radius:99px;padding:1px 8px;margin-left:6px;font-variant-numeric:tabular-nums}
.ov-block{border-top:1px solid var(--line);padding:9px 0}
.ov-block:first-of-type{border-top:none;padding-top:2px}
.ov-block h3{font-size:14px;line-height:1.3;font-weight:800;margin-bottom:5px}
.ov-gap{font-size:13px;line-height:1.55;color:var(--ink)}
.ov-list{list-style:none;font-size:13px;line-height:1.5}
.row-line{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.row-line:first-child{border-top:none}
.row-line .glyph{width:16px;flex:none;text-align:center;font-weight:800}
.row-line .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-line .when{font-size:12px;line-height:1.4;color:var(--ink);flex:none;font-variant-numeric:tabular-nums}
.ov-meta{font-size:12px;line-height:1.5;color:var(--ink)}
.ov-countbar{display:flex;gap:6px;margin:6px 0}
.ov-count{flex:1;background:var(--soft);border-radius:8px;padding:6px 4px;text-align:center}
.ov-count .num{display:block;font-size:16px;line-height:1.2;font-weight:800;font-variant-numeric:tabular-nums}
.ov-count .lab{display:block;font-size:11px;line-height:1.3;color:var(--ink);font-weight:700}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
<div class="hi" id="dateLine">今日简报</div>
<h1>早上好，Miao</h1>
<div class="sub">今天还没有日程。</div>
</header>
<main>
<section class="search-card" aria-label="search">
<div class="searchbar"><input id="globalSearch" type="search" placeholder="搜索日程、对话、公司内容…" data-i18n-ph="searchPlaceholder" aria-label="搜索日程、对话、公司内容"><button class="small" id="searchClear" type="button" data-i18n="searchClear">清除</button></div>
<div id="searchResults"><div class="empty" data-i18n="searchHint">输入关键词，搜索日程、对话和公司快照。</div></div>
</section>
<section class="view on" id="v-brief">
<div class="card" id="companyCard">
<h2><span data-i18n="companyTitle">公司总览</span><span class="tag" data-i18n="companyTag">公司快照</span></h2>
<div id="companyBody"><div class="empty" data-i18n="noSnapshotData">未连接快照 — 本地模式。</div></div>
<div class="note" id="snapshotNote"></div>
</div>
<div class="card">
<h2 data-i18n="todayBriefing">今日简报</h2>
<div id="briefSummary"></div>
<div id="briefList"></div>
</div>
<div class="card">
<h2 data-i18n="pendingTitle">待办</h2>
<div id="pendingList"></div>
</div>
</section>
<section class="view" id="v-plan">
<div class="card">
<h2 data-i18n="planTitle">我的日程</h2>
<label for="newTitle" data-i18n="formTitleLabel">标题</label>
<input id="newTitle" type="text" placeholder="例如：和沈默过一遍产品方案" data-i18n-ph="formTitlePlaceholder">
<label for="newTime" data-i18n="formTimeLabel">时间</label>
<input id="newTime" type="time" value="09:00">
<label for="newQuadrant" data-i18n="formQuadrantLabel">象限</label>
<select id="newQuadrant">
<option value="important-urgent" data-i18n="quadIU">重要且紧急</option>
<option value="important-not-urgent" data-i18n="quadINU">重要不紧急</option>
<option value="not-important-urgent" data-i18n="quadNIU">不重要但紧急</option>
<option value="not-important-not-urgent" data-i18n="quadNINU">不重要不紧急</option>
</select>
<div class="row"><button class="btn primary" id="addItem" type="button" data-i18n="addSchedule">添加日程</button></div>
<div id="scheduleList"></div>
<div class="note" data-i18n="scheduleNote">日程只保存在这台设备上，不会上传。</div>
</div>
</section>
<section class="view" id="v-team">
<div class="card">
<h2 data-i18n="teamTitle">团队</h2>
<div class="grid">
<div class="agent"><div class="n">沈默</div><div class="r"><span class="dot"></span><span data-i18n="roleChen">产品策略</span></div></div>
<div class="agent"><div class="n">阿诚</div><div class="r"><span class="dot"></span><span data-i18n="roleCheng">运营执行</span></div></div>
<div class="agent"><div class="n">小林</div><div class="r"><span class="dot"></span><span data-i18n="roleLin">市场洞察</span></div></div>
<div class="agent"><div class="n">苏菲</div><div class="r"><span class="dot"></span><span data-i18n="roleSu">财务分析</span></div></div>
</div>
</div>
<div class="card" id="teamSnapshotCard" hidden>
<h2 data-i18n="teamSnapshotTitle">团队快照</h2>
<div id="teamSnapshotBody"></div>
</div>
<div class="note" data-i18n="teamNote">团队成员来自快照；快照未连接时只显示本地四人。</div>
</section>
<section class="view" id="v-chat">
<div class="card">
<h2 data-i18n="chatTitle">与沈默对话</h2>
<div id="chatList"></div>
<label for="chatInput" data-i18n="chatInputLabel">给沈默写一句话</label>
<textarea id="chatInput" rows="3" placeholder="给沈默写一句话…" data-i18n-ph="chatPlaceholder"></textarea>
<div class="row"><button class="big" id="chatSend" type="button" data-i18n="chatSend">发送</button></div>
</div>
</section>
<section class="view" id="v-profile">
<div class="card">
<h2 data-i18n="profileTitle">我的资料</h2>
<label for="profileName" data-i18n="nameLabel">名字</label>
<input id="profileName" type="text" value="Miao">
<label for="profileRole" data-i18n="roleLabel">角色</label>
<select id="profileRole">
<option value="product" data-i18n="roleProduct">产品</option>
<option value="operations" data-i18n="roleOperations">运营</option>
<option value="marketing" data-i18n="roleMarketing">市场</option>
<option value="finance" data-i18n="roleFinance">财务</option>
</select>
<div class="row"><button class="btn primary" id="saveProfile" type="button" data-i18n="saveProfile">保存资料</button></div>
<div class="note" id="profileSaved" hidden data-i18n="profileSaved">已保存。</div>
</div>
<div class="card">
<h2 data-i18n="snapshotTitle">快照来源</h2>
<label for="snapshotUrl" data-i18n="snapshotUrlLabel">快照地址</label>
<input id="snapshotUrl" type="url" placeholder="https://…/snapshot.json" data-i18n-ph="snapshotUrlPlaceholder">
<div class="row"><button class="btn ink" id="saveSnapshotUrl" type="button" data-i18n="saveSnapshotUrl">保存快照地址</button><button class="btn" id="refreshSnapshot" type="button" data-i18n="refreshSnapshot">刷新快照</button></div>
<div class="note" id="snapshotStatus"></div>
<div class="note" data-i18n="snapshotNote">公司数据来自配置的快照地址，只显示已脱敏的展示标题；没有标题的条目只计数量。</div>
</div>
<div class="card">
<h2 data-i18n="languageTitle">语言</h2>
<label for="languageSelect" data-i18n="languageLabel">界面语言</label>
<select id="languageSelect">
<option value="system" data-i18n="langSystem">跟随系统</option>
<option value="zh-CN">中文</option>
<option value="en">English</option>
</select>
</div>
<div class="card">
<h2 data-i18n="dataTitle">数据管理</h2>
<div class="row"><button class="btn" id="clearData" type="button" data-i18n="clearData">清空本地日程与对话</button></div>
<div class="note" data-i18n="clearDataNote">只清除这台设备上的本地日程与对话，不影响快照。</div>
</div>
</section>
</main>
<nav>
<button type="button" data-view="v-brief" class="on" data-i18n="navBrief">简报</button>
<button type="button" data-view="v-plan" data-i18n="navPlan">日程</button>
<button type="button" data-view="v-team" data-i18n="navTeam">团队</button>
<button type="button" data-view="v-chat" data-i18n="navChat">对话</button>
<button type="button" data-view="v-profile" data-i18n="navMe">我的</button>
</nav>
<script>

function renderSnapshot(){var body=document.getElementById('companyBody');if(!body)return;var html='';var status='local';if(snapshot){if(snapshotFromCache)status='cached';else if(snapshotFetchedAt&&Date.now()-snapshotFetchedAt>3600000)status='stale';else status='live'}else if(snapshotError)status='not_connected';var level=signalLevel(status);var names={local:'snapshotLocal',live:'snapshotLive',cached:'snapshotCached',stale:'snapshotStale',not_connected:'snapshotNotConnected'};var gen=(snapshot&&snapshot.generation!=null)?snapshot.generation:null;html+='<div class="snapstrip"><span class="snapdisc" style="--disc:'+level+'%"><span class="snapdisc-core"></span></span><div class="snapline"><span class="snapstate">'+esc(t(names[status]))+'</span>'+(snapshot&&snapshotFetchedAt?' \u00b7 '+esc(t('snapshotAge',{age:formatAge(Date.now()-snapshotFetchedAt)})):'')+'</div>'+(gen!=null?'<button class="snapgen" type="button" onclick="fetchSnapshot()">Gen #'+gen+'</button>':'')+'</div>';var pa=snapshot?snapshot.pendingApprovals:null;var paCount=0;if(pa){paCount=(pa.count!=null&&pa.count!==undefined)?pa.count:((pa.items)?pa.items.length:0)}if(pa&&pa.status==='not_connected'){html+='<div class="pending-slim">'+esc(t('approvalsNotConnected'))+'</div>'}else if(paCount>0){html+='<button type="button" class="pending-strip" onclick="gotoApprovals()"><span class="ov-badge num">'+paCount+'</span><span>'+esc(t('approvalsCount'))+'</span><span class="go">'+esc(t('pendingGo'))+' \u203a</span></button>'}if(snapshot&&snapshot.briefing){html+='<div class="ov-block"><h3><button class="block-head" type="button" onclick="showView(\'v-brief\')"><span>'+esc(t('briefing'))+(snapshot.briefing.date?' \u00b7 '+esc(formatDate(snapshot.briefing.date)):'')+'</span><span class="go">'+esc(t('viewAll'))+' \u203a</span></button></h3><div class="ov-gap">'+esc(snapshot.briefing.summary||'')+'</div>';if(snapshot.briefing.items&&snapshot.briefing.items.length){html+='<ul class="ov-list">'+snapshot.briefing.items.map(function(it){return '<li class="row-line"><span class="glyph">\u25a4</span><span class="title">'+esc(it)+'</span></li>'}).join('')+'</ul>'}html+='</div>'}else{html+='<div class="ov-block"><h3>'+esc(t('briefing'))+'</h3><div class="ov-gap">'+esc(t('noSnapshotData'))+'</div></div>'}if(snapshot&&snapshot.overview&&snapshot.overview.goals){html+='<div class="ov-block"><h3><button class="block-head" type="button" onclick="showView(\'v-plan\')"><span>'+esc(t('goals'))+'</span><span class="go">'+esc(t('viewAll'))+' \u203a</span></button></h3>'+countBar(snapshot.overview.goals);if(snapshot.goals&&snapshot.goals.length){html+='<ul class="ov-list">'+snapshot.goals.map(function(g){return '<li class="row-line"><span class="glyph">\u25ce</span><span class="title">'+esc(g.displayTitle||(t('goalFallback')+' #'+g.id))+'</span></li>'}).join('')+'</ul>'}html+='</div>'}else{html+='<div class="ov-block"><h3>'+esc(t('goals'))+'</h3><div class="ov-gap">'+esc(t('noSnapshotData'))+'</div></div>'}if(snapshot&&snapshot.overview&&Array.isArray(snapshot.overview.recent_activity)){html+='<div class="ov-block"><h3><button class="block-head" type="button" onclick="showView(\'v-chat\')"><span>'+esc(t('activity'))+'</span><span class="go">'+esc(t('viewAll'))+' \u203a</span></button></h3>';if(snapshot.overview.recent_activity.length){html+='<ul class="ov-list">'+snapshot.overview.recent_activity.map(function(a){return '<li class="row-line"><span class="glyph">'+esc(glyphFor(a.type))+'</span><span class="title">'+esc(a.displayTitle||a.type)+'</span><span class="when">'+esc(formatDate(a.date))+'</span></li>'}).join('')+'</ul>'}else{html+='<div class="ov-gap">'+esc(t('noSnapshotData'))+'</div>'}html+='</div>'}else{html+='<div class="ov-block"><h3>'+esc(t('activity'))+'</h3><div class="ov-gap">'+esc(t('noSnapshotData'))+'</div></div>'}if(snapshot&&Array.isArray(snapshot.decisions)){html+='<div class="ov-block"><h3><button class="block-head" type="button" onclick="gotoApprovals()"><span>'+esc(t('decisions'))+'</span><span class="go">'+esc(t('viewAll'))+' \u203a</span></button></h3>';if(snapshot.decisions.length){html+='<ul class="ov-list">'+snapshot.decisions.map(function(d){return '<li class="row-line"><span class="glyph">\u2713</span><span class="title">'+esc(d.displayTitle||(t('decisionFallback')+' #'+d.id))+'</span><span class="when">'+esc(formatDate(d.date))+'</span></li>'}).join('')+'</ul>'}else{html+='<div class="ov-gap">'+esc(t('noSnapshotData'))+'</div>'}html+='</div>'}else{html+='<div class="ov-block"><h3>'+esc(t('decisions'))+'</h3><div class="ov-gap">'+esc(t('noSnapshotData'))+'</div></div>'}html+='<div class="ov-block" id="approvalsBlock"><h3><button class="block-head" type="button" onclick="gotoApprovals()"><span>'+esc(t('approvals'))+(pa&&pa.status!=='not_connected'&&paCount>0?'<span class="ov-badge num">'+paCount+'</span>':'')+'</span><span class="go">'+esc(t('viewAll'))+' \u203a</span></button></h3>';if(!snapshot){html+='<div class="ov-gap">'+esc(t('noSnapshotData'))+'</div>'}else if(pa&&pa.status==='not_connected'){html+='<div class="ov-gap">'+esc(t('approvalsNotConnected'))+'</div>'}else if(pa&&pa.items&&pa.items.length){html+='<div class="ov-meta num">'+paCount+' '+esc(t('approvalsCount'))+'</div>';pa.items.forEach(function(a){html+='<div class="item"><div class="t">'+esc(a.displayTitle||(a.id||t('approvalFallback')))+'</div>'+(a.proposer?'<div class="d">'+esc(t('proposer'))+': '+esc(a.proposer)+'</div>':'')+(a.effect?'<div class="d">'+esc(t('effect'))+': '+esc(a.effect)+'</div>':'')+(a.subjectRef?'<div class="ov-meta">'+esc(t('subject'))+': '+esc(a.subjectRef)+'</div>':'')+'</div>'});}else{html+='<div class="ov-gap">'+esc(t('approvalsNoItems'))+'</div>'}html+='</div>';html+='<div class="ov-block"><h3><button class="block-head" type="button" onclick="showView(\'v-profile\')"><span>'+esc(t('health'))+'</span><span class="go">'+esc(t('viewAll'))+' \u203a</span></button></h3>';if(!snapshot){html+='<div class="ov-gap">'+esc(t('noSnapshotData'))+'</div>'}else if(snapshot.fleetHealth){var hp=[];for(var hk in snapshot.fleetHealth){if(Object.prototype.hasOwnProperty.call(snapshot.fleetHealth,hk))hp.push(hk+': '+snapshot.fleetHealth[hk])}html+='<div class="ov-meta">'+esc(hp.join(' \u00b7 '))+'</div>'}else{html+='<div class="ov-gap">'+esc(t('healthNoData'))+'</div>'}html+='</div>';body.innerHTML=html;var card=document.getElementById('companyCard');if(card)card.hidden=false;if(!snapshot){var teamCard=document.getElementById('teamSnapshotCard');if(teamCard)teamCard.hidden=true;var note0=document.getElementById('snapshotNote');if(note0)note0.textContent=snapshotError||t('snapshotLocalOnly');return}var tparts=[];if(snapshot.team){if(snapshot.team.workspaces!=null&&snapshot.team.workspaces!==undefined)tparts.push(t('teamWorkspacesCount',{n:snapshot.team.workspaces}));if(snapshot.team.goals!=null&&snapshot.team.goals!==undefined)tparts.push(t('teamGoalsCount',{n:snapshot.team.goals}))}if(tparts.length){var tc=document.getElementById('teamSnapshotCard');if(tc)tc.hidden=false;var tb=document.getElementById('teamSnapshotBody');if(tb)tb.innerHTML='<div class="item"><div class="t">'+esc(tparts.join(' \u00b7 '))+'</div><div class="d">'+esc(snapshotFromCache?t('teamFromSnapshotCached',{age:formatAge(Date.now()-snapshotFetchedAt)}):t('teamFromSnapshot'))+'</div></div>'}else if(document.getElementById('teamSnapshotCard'))document.getElementById('teamSnapshotCard').hidden=true;var note=document.getElementById('snapshotNote');if(note)note.textContent=snapshotFromCache?t('snapshotFromCache')+' '+t('snapshotAge',{age:formatAge(Date.now()-snapshotFetchedAt)}):(snapshotError||t('snapshotSourceNote'))}
function showView(id){document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('on',x.dataset.view===id)});document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id===id)});window.scrollTo(0,0)}
function searchResultsFor(q){var needle=q.trim().toLowerCase();if(!needle)return[];var results=[];state.schedule.forEach(function(item){if((item.title+' '+item.time+' '+quadrantLabel(item.quadrant)).toLowerCase().indexOf(needle)>-1)results.push({kind:t('searchKindSchedule'),text:item.title,detail:item.time+' \u00b7 '+quadrantLabel(item.quadrant),view:'v-plan'})});state.messages.forEach(function(msg){if(msg.text.toLowerCase().indexOf(needle)>-1)results.push({kind:t('searchKindJournal'),text:msg.text,detail:formatTime(msg.createdAt),view:'v-chat'})});if(snapshot){if(snapshot.briefing&&snapshot.briefing.displayTitle&&snapshot.briefing.displayTitle.toLowerCase().indexOf(needle)>-1)results.push({kind:t('searchKindBriefing'),text:snapshot.briefing.displayTitle,detail:(snapshot.briefing.kind||'')+' \u00b7 '+(snapshot.briefing.date||''),view:'v-brief'});if(snapshot.goals)snapshot.goals.forEach(function(g){if(g.displayTitle&&g.displayTitle.toLowerCase().indexOf(needle)>-1)results.push({kind:t('searchKindGoal'),text:g.displayTitle,detail:t('searchDetailGoal'),view:'v-brief'})});if(snapshot.decisions)snapshot.decisions.forEach(function(d){var hay=(d.displayTitle||'')+' '+(d.id||'');if(hay.toLowerCase().indexOf(needle)>-1)results.push({kind:t('searchKindDecision'),text:d.displayTitle||(d.id||t('decisionFallback')),detail:(d.date||'')+(d.displayTitle?'':t('searchNoDisplayTitle')),view:'v-brief'})});if(snapshot.overview&&Array.isArray(snapshot.overview.recent_activity))snapshot.overview.recent_activity.forEach(function(a){if(a.displayTitle&&a.displayTitle.toLowerCase().indexOf(needle)>-1)results.push({kind:t('searchKindActivity'),text:a.displayTitle,detail:(a.type||'')+' \u00b7 '+(a.date||''),view:'v-brief'})});if(snapshot.pendingApprovals&&snapshot.pendingApprovals.items)snapshot.pendingApprovals.items.forEach(function(a){if(a.displayTitle&&a.displayTitle.toLowerCase().indexOf(needle)>-1)results.push({kind:t('searchKindApproval'),text:a.displayTitle,detail:(a.proposer?t('searchProposer')+': '+a.proposer:'')+(a.effect?' \u00b7 '+t('searchEffect')+': '+a.effect:''),view:'v-brief'})});if(snapshot.team){var tp=[];if(snapshot.team.workspaces!=null&&snapshot.team.workspaces!==undefined)tp.push(t('teamWorkspacesCount',{n:snapshot.team.workspaces}));if(snapshot.team.goals!=null&&snapshot.team.goals!==undefined)tp.push(t('teamGoalsCount',{n:snapshot.team.goals}));if(tp.length)results.push({kind:t('searchKindTeam'),text:tp.join(' \u00b7 '),detail:t('searchTeamDetail'),view:'v-team'})}}return results}
function renderSearch(){var input=document.getElementById('globalSearch');var box=document.getElementById('searchResults');if(!input||!box)return;var q=input.value;if(!q.trim()){box.innerHTML='<div class="empty">'+esc(t('searchHint'))+'</div>';return}var results=searchResultsFor(q);if(results.length===0){box.innerHTML='<div class="empty">'+esc(t('searchNoResults',{q:q}))+'</div>';return}box.innerHTML=results.map(function(r){return '<div class="item"><div class="t">'+esc(r.text)+'</div><div class="d">'+esc(r.kind)+' \u00b7 '+esc(r.detail)+'</div><div class="row"><button class="small" type="button" data-search-view="'+r.view+'">'+esc(t('searchOpen'))+'</button></div></div>'}).join('')}
function bindSearch(){var input=document.getElementById('globalSearch');var clear=document.getElementById('searchClear');if(input)input.addEventListener('input',renderSearch);if(clear)clear.addEventListener('click',function(){if(input){input.value='';renderSearch();input.focus()}});var box=document.getElementById('searchResults');if(box)box.addEventListener('click',function(e){var b=e.target.closest('[data-search-view]');if(b)showView(b.getAttribute('data-search-view'))})}
function renderAll(){applyI18n();renderSnapshot();renderBriefing();renderSchedule();renderChat();renderProfile()}
getState();loadJournal();
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){showView(b.dataset.view)})});
document.getElementById('addItem').addEventListener('click',addSchedule);
document.getElementById('chatSend').addEventListener('click',sendMessage);
document.getElementById('chatInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
document.getElementById('saveProfile').addEventListener('click',function(){var n=document.getElementById('profileName');var r=document.getElementById('profileRole');if(n)state.profile.name=n.value.trim()||'Miao';if(r)state.profile.role=r.value;saveState();renderAll();var s=document.getElementById('profileSaved');if(s)s.hidden=false});
document.getElementById('saveSnapshotUrl').addEventListener('click',function(){var u=document.getElementById('snapshotUrl');if(u){localStorage.setItem('fit.snapshot.url',u.value.trim());var st=document.getElementById('snapshotStatus');if(st)st.textContent=t('snapshotSaved')}});
document.getElementById('refreshSnapshot').addEventListener('click',function(){var u=getSnapshotUrl();if(!u){var st=document.getElementById('snapshotStatus');if(st)st.textContent=t('snapshotNoUrl');return}fetchSnapshot()});
document.getElementById('languageSelect').addEventListener('change',function(e){var v=e.target.value;if(v==='system'){localStorage.removeItem('fit.lang')}else{localStorage.setItem('fit.lang',v)}lang=getLang();renderAll()});
document.getElementById('clearData').addEventListener('click',function(){if(!confirm(t('clearConfirm')))return;try{localStorage.removeItem('fit.schedule.v1');localStorage.removeItem('fit.journal.v1')}catch(e){}state.schedule=[];state.messages=[];getState();loadJournal();renderAll()});
bindSearch();
renderAll();
loadSnapshot();
setInterval(function(){renderSnapshot()},60000);
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(r){if(r&&r.update)r.update()}).catch(function(){})});navigator.serviceWorker.addEventListener('controllerchange',function(){if(sessionStorage.getItem('helm-sw-reloaded'))return;sessionStorage.setItem('helm-sw-reloaded','1');location.reload()})}
